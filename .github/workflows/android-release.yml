name: Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
  # Build-only triggers. `main` and `listen-together-test` keep their existing behaviour;
  # `rust-migration-test` is the experimental Rust migration branch and is deliberately
  # build-only as well. Publishing stays gated on the `release` event below, so a push to any
  # of these branches can never create a GitHub release or reach users.
  push:
    branches:
      - listen-together-test
      - main
      - rust-migration-test

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Java 21, not 17: androidApp sets sourceCompatibility/targetCompatibility to VERSION_21 and
      # there is no Gradle toolchain configured, so a 17 JDK cannot compile the sources.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # The Rust core is cross-compiled by Gradle (see :rustBridge:cargoBuildAndroidJniLibs),
      # which invokes cargo directly and points CARGO_TARGET_*_LINKER at the NDK clang wrapper.
      # Only rustup + the three Android targets are needed.
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo --version
          rustc --version

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      # No setup-android action: the ubuntu runner ships a licensed Android SDK, and the
      # third-party action's sdkmanager version check fails on the ubuntu-26.04 image (it then
      # stops at an interactive license prompt). Use the preinstalled SDK directly.
      #
      # The NDK version is pinned to :rustBridge's `ndkVersion` so the Rust objects and AGP use
      # one toolchain, and it is installed explicitly rather than relying on AGP auto-download.
      - name: Install Android NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"
          NDK="$SDK/ndk/27.0.12077973"
          test -d "$NDK" || { echo "NDK missing at $NDK"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          ls "$NDK/toolchains/llvm/prebuilt"

      # Fails fast on parser regressions before the (much slower) Gradle build starts.
      - name: Rust core tests
        run: cargo test --locked --manifest-path rust/Cargo.toml

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > androidApp/earix-release.jks
          ls -la androidApp/earix-release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Kotlin half of the Kotlin/Rust equivalence contract: the golden test asserts the same
      # expected lines as rust/earix-core/tests/lrc_document.rs.
      - name: Kotlin lyrics parser tests
        run: ./gradlew :lyricsService:jvmTest --no-daemon

      - name: Build Signed APK
        run: |
          ./gradlew :androidApp:assembleDebug --no-daemon \
            -PEARIX_KEYSTORE_PATH="earix-release.jks" \
            -PEARIX_KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PEARIX_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PEARIX_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Report packaged native libraries
        run: |
          unzip -l androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            | grep -E "lib/.*\.so" | sort

      - name: List APK files
        run: ls -la androidApp/build/outputs/apk/debug/

      # Downloadable artifact for side-loading the test build. Deliberately separate from the
      # release step below: this uploads to the workflow run only, never to a release.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: earix-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean up keystore
        if: always()
        run: rm -f androidApp/earix-release.jks

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: androidApp/build/outputs/apk/debug/androidApp-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
