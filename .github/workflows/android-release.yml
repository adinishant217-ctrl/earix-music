name: Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > androidApp/earix-release.jks
          ls -la androidApp/earix-release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed APK
        run: |
          ./gradlew :androidApp:assembleDebug --no-daemon \
            -PEARIX_KEYSTORE_PATH="earix-release.jks" \
            -PEARIX_KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PEARIX_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PEARIX_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Clean up keystore
        if: always()
        run: rm -f androidApp/earix-release.jks

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: androidApp/build/outputs/apk/debug/androidApp-universal-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
